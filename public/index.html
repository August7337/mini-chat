<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div id="messages"></div>
    <form id="chat-form">
        <input type="text" id="un-input" placeholder="Username" autocomplete="off" maxlength="50">
        <input type="text" id="msg-input" placeholder="Écrit ton message ici..." autocomplete="off" maxlength="2000">
        <input type="file" id="file-input">
        <button type="submit" id="send-btn">Envoyer</button>
    </form>

    <script src="app.js"></script>
</body>

</html>
